<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><title>Inquiry form registration</title></head><body>
<form name="vendrick-inquiry" method="POST" data-netlify="true" netlify-honeypot="website" hidden>
<input type="hidden" name="form-name" value="vendrick-inquiry">
<input name="name" required minlength="2" maxlength="100">
<input name="email" type="email" required maxlength="254">
<input name="phone" type="tel" maxlength="40">
<input name="company" maxlength="150">
<input name="topic"><input name="service"><input name="tools" maxlength="200"><input name="budget">
<textarea name="description" required minlength="20" maxlength="5000"></textarea>
<input name="website">
</form>
</body></html>
